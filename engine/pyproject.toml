[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-engine"
version = "0.1.0"
description = "Reusable, AI-native ontology engine: objects, links, read-only functions, validated actions, grounded+evaluated AI."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "rapidfuzz>=3",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Postgres + pgvector storage backend (JSON backend needs none of this).
postgres = [
    "SQLAlchemy>=2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "psycopg[binary]>=3.1",
]
# Hosted embedding provider (default in cloud).
embeddings-voyage = [
    "voyageai>=0.2",
]
# Local embedding provider (offline/dev + hermetic CI).
embeddings-local = [
    "sentence-transformers>=3",
]
# AI agent + LLM-as-judge evals.
ai = [
    "anthropic>=0.40",
]
# Live external transport (YouTube OAuth write). Not needed for tests/mock runs.
live = [
    "google-api-python-client>=2",
    "google-auth-oauthlib>=1",
]
dev = [
    "pytest>=7",
    "ruff>=0.5",
    "black>=24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.black]
line-length = 100
