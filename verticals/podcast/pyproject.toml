[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vertical-podcast"
version = "0.1.0"
description = "Vertical #1 (podcast ops) plugin for the ontology engine: Show/Episode/Guest/Clip, YouTube + Apple sources, functions, actions."
requires-python = ">=3.11"
dependencies = [
    "ontology-engine",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Live YouTube write transport (OAuth). Apple read is public/no-auth.
live = [
    "google-api-python-client>=2",
    "google-auth-oauthlib>=1",
]
dev = [
    "pytest>=7",
    "ruff>=0.5",
    "black>=24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../engine/src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.black]
line-length = 100
